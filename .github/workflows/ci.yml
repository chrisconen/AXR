name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '18', '20', '22' ]
        python: [ '3.10', '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Versions
        run: |
          node --version
          python3 --version

      # Zero external dependencies by design - no install step needed.
      # The full suite includes the JS<->Python cross-implementation parity
      # test (axr-crossverify-test.js spawns axr_verify.py), so a green run
      # here is the standing proof that both verifiers agree.
      - name: Run full test suite
        run: node run-tests.js

  adversarial-matrix:
    name: Adversarial tamper matrix (both verifiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 15-mutation tamper matrix
        run: node axr-adversarial-test.js
      - name: Cross-implementation agreement (valid + tampered)
        run: node axr-crossverify-test.js
